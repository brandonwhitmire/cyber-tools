# Vendored offensive-security tooling (PEASS, etc.) intentionally contains
# secret-like patterns used for scanning/detection. Exclude the whole tree
# from GitHub secret scanning / push protection false positives.
# See: https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
paths-ignore:
  - "**"
